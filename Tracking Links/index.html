<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Link Builder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #5b6af4;
      --accent-hover: #4a59e8;
      --accent-light: rgba(91,106,244,0.12);
      --success: #34d399;
      --success-bg: rgba(52,211,153,0.1);
      --warning: #fbbf24;
      --warning-bg: rgba(251,191,36,0.1);
      --error: #f87171;
      --error-bg: rgba(248,113,113,0.1);
      --text: #e2e8f0;
      --text-muted: #8892b0;
      --text-dim: #4a5568;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #5b6af4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.82rem;
      padding: 12px 14px;
      resize: vertical;
      transition: border-color 0.15s;
      outline: none;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    textarea { min-height: 110px; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 560px) {
      .field-row { grid-template-columns: 1fr; }
    }

    .field-group { margin-bottom: 18px; }
    .field-group:last-child { margin-bottom: 0; }

    .hint {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.99); }

    .btn-copy {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .btn-copy.copied { border-color: var(--success); color: var(--success); }

    .alert {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .alert-icon { flex-shrink: 0; margin-top: 1px; font-size: 1rem; }

    .alert-error { background: var(--error-bg); border: 1px solid var(--error); color: var(--error); }
    .alert-warning { background: var(--warning-bg); border: 1px solid var(--warning); color: var(--warning); }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); }
    .alert-info { background: var(--accent-light); border: 1px solid var(--accent); color: #a5b4fc; }

    .hidden { display: none !important; }

    #output-section { margin-top: 4px; }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .badge-legacy { background: rgba(251,191,36,0.15); color: var(--warning); border: 1px solid rgba(251,191,36,0.3); }
    .badge-odt { background: rgba(52,211,153,0.12); color: var(--success); border: 1px solid rgba(52,211,153,0.25); }
    .badge-hashed { background: var(--accent-light); color: #a5b4fc; border: 1px solid rgba(91,106,244,0.3); }

    .output-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.8rem;
      word-break: break-all;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
    }

    .param-changed { color: var(--success); font-weight: 600; }

    .changes-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .change-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .change-item .tick { color: var(--success); }
    .change-item code {
      font-family: 'Consolas', monospace;
      background: var(--surface2);
      padding: 1px 6px;
      border-radius: 3px;
      color: var(--text);
      font-size: 0.78rem;
    }

    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tracking Link Builder</h1>
      <p>Paste a raw tracking link, enter your device ID, and get a test-ready output.</p>
    </header>

    <!-- Input Card -->
    <div class="card">
      <div class="card-title"><span class="dot"></span>Input</div>

      <div class="field-group">
        <label for="tracking-input">Raw Tracking Link</label>
        <textarea id="tracking-input" placeholder="https://app.appsflyer.com/com.example.app?pid=appia_int&clickid=[ClickID]&..."></textarea>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="device-id">Your Device ID (GAID / AAID)</label>
          <input type="text" id="device-id" placeholder="278d8c12-bdfc-4843-a4cd-043631edab0a" />
          <div class="hint">Raw UUID or already-hashed SHA1 value.</div>
        </div>
        <div class="field-group">
          <label for="click-id">Test Click ID</label>
          <input type="text" id="click-id" value="David1" />
          <div class="hint">Replaces <code style="background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:0.75rem;">[ClickID]</code> placeholder.</div>
        </div>
      </div>

      <div class="field-group">
        <label for="product-type">Product Type (ODT only)</label>
        <select id="product-type" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.88rem;padding:12px 14px;outline:none;cursor:pointer;">
          <option value="">— Select if using OneDigitalTurbine —</option>
          <option value="ODS">ODS</option>
          <option value="DSP">DSP</option>
        </select>
        <div class="hint">Required for ODT integrations. Sets <code style="background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:0.75rem;">id2</code> to channel-specific value.</div>
      </div>

      <button class="btn-primary" onclick="buildLink()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
        Build Link
      </button>
    </div>

    <!-- Output Card -->
    <div class="card hidden" id="output-section">
      <div class="card-title"><span class="dot"></span>Output</div>

      <div id="alert-container"></div>

      <div class="output-header">
        <div class="badges" id="badges"></div>
        <button class="btn-copy" id="copy-btn" onclick="copyLink()">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy
        </button>
      </div>

      <div class="output-box" id="output-box"></div>

      <div class="changes-list" id="changes-list"></div>
    </div>
  </div>

  <script>
    // ── Performance: Cache DOM elements on load ───────────────────────────────
    const DOM = {};
    
    function initDOM() {
      DOM.trackingInput = document.getElementById('tracking-input');
      DOM.deviceId = document.getElementById('device-id');
      DOM.clickId = document.getElementById('click-id');
      DOM.productType = document.getElementById('product-type');
      DOM.outputSection = document.getElementById('output-section');
      DOM.alertContainer = document.getElementById('alert-container');
      DOM.outputBox = document.getElementById('output-box');
      DOM.changesList = document.getElementById('changes-list');
      DOM.badges = document.getElementById('badges');
      DOM.copyBtn = document.getElementById('copy-btn');
    }

    // ── ODT id2 channel mapping ───────────────────────────────────────────────
    const ODT_ID2_MAP = {
      'ODS': 'dV9XX0xY',
      'DSP': 'ckFCRVBW'
    };

    // ── Pre-compiled regex patterns for speed ─────────────────────────────────
    const UUID_REGEX = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    const SHA1_REGEX = /^[0-9a-f]{40}$/i;
    const SHA1_PARAM_REGEX = /sha1/i;

    // ── Pre-allocated TextEncoder for SHA-1 (reused) ──────────────────────────
    const textEncoder = new TextEncoder();
    const hexLookup = Array.from({ length: 256 }, (_, i) => i.toString(16).padStart(2, '0'));

    // ── SHA-1 via Web Crypto API (optimized) ──────────────────────────────────
    async function sha1(str) {
      const data = textEncoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-1', data);
      const bytes = new Uint8Array(hashBuffer);
      let hex = '';
      for (let i = 0; i < bytes.length; i++) {
        hex += hexLookup[bytes[i]];
      }
      return hex;
    }

    // ── Detectors (optimized with pre-compiled regex) ─────────────────────────
    function isUUID(str) {
      return UUID_REGEX.test(str.trim());
    }

    function isSHA1Hash(str) {
      return SHA1_REGEX.test(str.trim());
    }

    // ── Alert helpers (create DOM elements instead of innerHTML) ──────────────
    function createAlert(type, icon, message) {
      const div = document.createElement('div');
      div.className = `alert alert-${type}`;
      div.innerHTML = `<span class="alert-icon">${icon}</span><span>${message}</span>`;
      return div;
    }

    // ── Plain ad ID params as Set for O(1) lookup ─────────────────────────────
    const PLAIN_AD_IDS = new Set(['advertising_id', 'android_id', 'device_id', 'idfa', 'gaid', 'aaid', 'af_idfa', 'af_android_id']);

    // ── Main builder (optimized) ──────────────────────────────────────────────
    async function buildLink() {
      const rawLink = DOM.trackingInput.value.trim();
      const deviceId = DOM.deviceId.value.trim();
      const clickIdVal = DOM.clickId.value.trim() || 'David1';
      const productType = DOM.productType.value;

      // Fast reset using textContent where possible
      DOM.alertContainer.textContent = '';
      DOM.outputBox.textContent = '';
      DOM.changesList.textContent = '';
      DOM.badges.textContent = '';
      DOM.outputSection.classList.remove('hidden');

      // ── Validate input ────────────────────────────────────────────────────
      if (!rawLink) {
        DOM.alertContainer.appendChild(createAlert('error', '⚠️', 'Please paste a tracking link first.'));
        return;
      }
      if (!deviceId) {
        DOM.alertContainer.appendChild(createAlert('error', '⚠️', 'Please enter your Device ID (GAID/AAID).'));
        return;
      }

      let url;
      try { url = new URL(rawLink); }
      catch {
        DOM.alertContainer.appendChild(createAlert('error', '⚠️', 'The tracking link does not appear to be a valid URL. Make sure it starts with <code>https://</code>.'));
        return;
      }

      const params = new URLSearchParams(url.search);
      const pid = params.get('pid') || '';
      const integrationIsODT = pid === 'onedigitalturbine_int';
      const changes = [];

      // ── Validate product type for ODT ─────────────────────────────────────
      if (integrationIsODT && !productType) {
        DOM.alertContainer.appendChild(createAlert('error', '⚠️', 'Please select a <strong>Product Type</strong> (ODS or DSP) for OneDigitalTurbine integration.'));
        return;
      }

      // ── Collect SHA1 params in single pass ──────────────────────────────────
      const sha1Params = [];
      let clickIdKey = null;
      
      for (const key of params.keys()) {
        const keyLower = key.toLowerCase();
        if (SHA1_PARAM_REGEX.test(key)) {
          sha1Params.push(key);
        }
        if (!clickIdKey && keyLower.replace('_', '') === 'clickid') {
          clickIdKey = key;
        }
      }

      // ── Determine hashing requirement ───────────────────────────────────────
      let resolvedDeviceId = deviceId;
      const sha1Required = sha1Params.length > 0;

      if (sha1Required) {
        if (isSHA1Hash(deviceId)) {
          resolvedDeviceId = deviceId.trim().toLowerCase();
        } else if (isUUID(deviceId)) {
          try {
            resolvedDeviceId = await sha1(deviceId.trim().toLowerCase());
            DOM.alertContainer.appendChild(createAlert('info', 'ℹ️', `Your Device ID was automatically SHA-1 hashed to: <strong>${resolvedDeviceId}</strong>`));
          } catch {
            DOM.alertContainer.appendChild(createAlert('error', '⚠️', 'Could not hash your Device ID. Please provide an already-hashed SHA-1 value (40 hex characters).'));
            return;
          }
        } else {
          DOM.alertContainer.appendChild(createAlert('warning', '⚠️', `The tracking link requires a <strong>SHA-1 hashed</strong> Device ID, but the value you entered doesn't look like a standard UUID or SHA-1 hash. Provide either a UUID (e.g. <code>278d8c12-bdfc-4843-a4cd-043631edab0a</code>) or a 40-character hex hash.`));
          return;
        }
      } else {
        if (!isUUID(deviceId) && !isSHA1Hash(deviceId)) {
          DOM.alertContainer.appendChild(createAlert('warning', '⚠️', 'The Device ID format looks unexpected. Continuing anyway — verify the output.'));
        }
        resolvedDeviceId = deviceId.trim();
      }

      // ── Apply rules (unified for both integration types) ────────────────────
      if (clickIdKey) {
        params.set(clickIdKey, clickIdVal);
        changes.push({ param: clickIdKey, value: clickIdVal, desc: 'Test click ID' });
      }

      for (const key of sha1Params) {
        params.set(key, resolvedDeviceId);
        changes.push({ param: key, value: resolvedDeviceId, desc: 'Hashed Device ID (SHA-1)' });
      }

      if (!sha1Required) {
        for (const key of params.keys()) {
          if (PLAIN_AD_IDS.has(key.toLowerCase())) {
            params.set(key, resolvedDeviceId);
            changes.push({ param: key, value: resolvedDeviceId, desc: 'Raw Device ID' });
          }
        }
      }

      // ── ODT: Replace id2 with channel-specific value ────────────────────────
      if (integrationIsODT && params.has('id2') && productType) {
        const id2Value = ODT_ID2_MAP[productType];
        params.set('id2', id2Value);
        changes.push({ param: 'id2', value: id2Value, desc: `Channel ID (${productType})` });
      }

      // ── Build output with highlights (using DocumentFragment) ───────────────
      const changedKeys = new Set(changes.map(c => c.param));
      const base = `${url.origin}${url.pathname}?`;
      
      const fragment = document.createDocumentFragment();
      fragment.appendChild(document.createTextNode(base));

      let isFirst = true;
      for (const [k, v] of params.entries()) {
        if (!isFirst) {
          fragment.appendChild(document.createTextNode('&'));
        }
        isFirst = false;
        
        if (changedKeys.has(k)) {
          const span = document.createElement('span');
          span.className = 'param-changed';
          span.textContent = `${k}=${v}`;
          fragment.appendChild(span);
        } else {
          fragment.appendChild(document.createTextNode(`${k}=${v}`));
        }
      }
      
      DOM.outputBox.appendChild(fragment);

      // ── Badges (using DocumentFragment) ─────────────────────────────────────
      const badgeFragment = document.createDocumentFragment();
      
      const integrationBadge = document.createElement('span');
      integrationBadge.className = `badge ${integrationIsODT ? 'badge-odt' : 'badge-legacy'}`;
      integrationBadge.textContent = integrationIsODT ? 'OneDigitalTurbine' : 'Legacy';
      badgeFragment.appendChild(integrationBadge);
      
      if (pid) {
        const pidBadge = document.createElement('span');
        pidBadge.className = 'badge badge-legacy';
        pidBadge.style.cssText = 'background:rgba(139,148,158,0.1);color:#8b94a0;border-color:rgba(139,148,158,0.2)';
        pidBadge.textContent = `pid: ${pid}`;
        badgeFragment.appendChild(pidBadge);
      }
      
      if (sha1Required) {
        const hashBadge = document.createElement('span');
        hashBadge.className = 'badge badge-hashed';
        hashBadge.textContent = 'SHA-1 Hashed';
        badgeFragment.appendChild(hashBadge);
      }
      
      if (integrationIsODT && productType) {
        const productBadge = document.createElement('span');
        productBadge.className = 'badge badge-odt';
        productBadge.textContent = `Product: ${productType}`;
        badgeFragment.appendChild(productBadge);
      }
      
      DOM.badges.appendChild(badgeFragment);

      // ── Changes summary (using DocumentFragment) ────────────────────────────
      const changesFragment = document.createDocumentFragment();
      
      if (changes.length > 0) {
        for (const c of changes) {
          const div = document.createElement('div');
          div.className = 'change-item';
          div.innerHTML = `<span class="tick">✓</span> <code>${escapeHtml(c.param)}</code> → <code>${escapeHtml(c.value)}</code> <span style="color:var(--text-dim);font-size:0.75rem;">${escapeHtml(c.desc)}</span>`;
          changesFragment.appendChild(div);
        }
      } else {
        const div = document.createElement('div');
        div.className = 'change-item';
        div.style.color = 'var(--text-dim)';
        div.textContent = 'No parameters were modified.';
        changesFragment.appendChild(div);
      }
      
      DOM.changesList.appendChild(changesFragment);
    }

    // ── Copy to clipboard (optimized with cached DOM) ─────────────────────────
    const COPY_ICON = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
    const COPIED_ICON = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
    
    async function copyLink() {
      const text = DOM.outputBox.textContent;
      try {
        await navigator.clipboard.writeText(text);
        DOM.copyBtn.classList.add('copied');
        DOM.copyBtn.innerHTML = COPIED_ICON;
        setTimeout(() => {
          DOM.copyBtn.classList.remove('copied');
          DOM.copyBtn.innerHTML = COPY_ICON;
        }, 2000);
      } catch {
        alert('Copy failed — please select and copy the link manually.');
      }
    }

    // ── HTML escape (optimized with single regex) ─────────────────────────────
    const ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
    const ESCAPE_REGEX = /[&<>"]/g;
    
    function escapeHtml(str) {
      return String(str).replace(ESCAPE_REGEX, m => ESCAPE_MAP[m]);
    }

    // ── Initialize on DOM ready ───────────────────────────────────────────────
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDOM);
    } else {
      initDOM();
    }

    // Allow Ctrl+Enter to build
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') buildLink();
    });
  </script>
</body>
</html>
